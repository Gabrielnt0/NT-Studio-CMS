<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <script>
      // Restaura a rota original após o redirecionamento do 404.html.
      (() => {
        const locationData = window.location;

        if (!locationData.search.startsWith("?/")) return;

        const decodedRoute = locationData.search
          .slice(2)
          .split("&")
          .map((part) => part.replace(/~and~/g, "&"));

        const routePath = decodedRoute.shift() || "";
        const queryString = decodedRoute.length ? `?${decodedRoute.join("&")}` : "";

        window.history.replaceState(
          null,
          "",
          `${locationData.pathname.slice(0, -1)}${routePath ? `/${routePath}` : "/"}${queryString}${locationData.hash}`,
        );
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Painel administrativo do NT Studio para gerenciamento de portfólio, projetos, experiências, formação e habilidades."
    />

    <meta name="author" content="Gabriel Andrade" />

    <meta name="theme-color" content="#09090b" />

    <title>NT Studio CMS</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
